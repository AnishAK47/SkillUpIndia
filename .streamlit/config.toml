# Dark only: with a single theme Streamlit ignores the visitor's system
# light/dark setting and hides the theme switcher, so the app always opens
# dark over the background video.
[theme]
base = "dark"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
baseFontSize = 15
headingFontWeights = [800, 700, 600, 600, 500, 500]

baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

primaryColor = "#818cf8"
backgroundColor = "#0b0b18"
secondaryBackgroundColor = "#151328"
textColor = "#ece9ff"
borderColor = "#2c2650"
linkColor = "#a5b4fc"
codeBackgroundColor = "#1b1836"
greenColor = "#4ade80"
redColor = "#f87171"
orangeColor = "#fbbf24"
blueColor = "#818cf8"
violetColor = "#c4b5fd"
grayColor = "#9691b8"
chartCategoricalColors = ["#818cf8", "#c4b5fd", "#22d3ee", "#fbbf24", "#f87171", "#4ade80", "#9691b8"]
chartSequentialColors = ["#1e1b4b", "#312e81", "#4338ca", "#4f46e5", "#6366f1", "#818cf8", "#a5b4fc", "#c7d2fe", "#e0e7ff", "#eef2ff"]
dataframeBorderColor = "#2c2650"
dataframeHeaderBackgroundColor = "#1b1836"

[theme.sidebar]
backgroundColor = "#05050d"
secondaryBackgroundColor = "#111022"
textColor = "#ece9ff"
borderColor = "#1f1c3d"
primaryColor = "#a5b4fc"
